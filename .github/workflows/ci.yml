name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # agent-os-nexo is built per version by `nexo os build`; this proves a build from this tree works.
      - run: node apps/os/scripts/build.ts --out "${{ runner.temp }}/agent-os-nexo" --version 0.0.0

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage

  # A real install on each OS: copy the source, npm-install the runtime for this machine, build, test-start (the
  # smoke test keeps the build only if it answers and loads every module), then start, check and stop it.
  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install agent-os-nexo into a fresh environment
        shell: bash
        run: |
          ENV="${RUNNER_TEMP}/env"
          node packages/cli/src/bin.ts init "$ENV" --yes --tools claude --name CI --email ci@example.com --language en --os yes --from apps/os --memory engram
          node packages/cli/src/bin.ts doctor --root "$ENV"
          node packages/cli/src/bin.ts memory status --root "$ENV"
          node packages/cli/src/bin.ts new smoke --root "$ENV"
          node .github/scripts/memory-smoke.mjs "$PWD/packages/cli/src/bin.ts" "$ENV" "$ENV/projects/smoke"
          node packages/cli/src/bin.ts os start --root "$ENV" --port 4799
          node packages/cli/src/bin.ts os status --root "$ENV"
          node packages/cli/src/bin.ts os stop --root "$ENV"
