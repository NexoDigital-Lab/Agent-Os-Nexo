name: release-desktop

# The desktop app's installers, one per OS and CPU, attached to a draft GitHub release with their SHA-256 sums.
# `nexo os desktop` downloads the one for the user's machine and refuses it unless its checksum matches.
# Run it by pushing a tag `desktop-v<version>` (or by hand); publish the draft after checking it.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            bundles: appimage,deb,rpm
          - os: ubuntu-22.04-arm
            name: linux-arm64
            bundles: appimage,deb,rpm
          - os: macos-latest
            name: macos-arm64
            bundles: dmg
          - os: macos-13
            name: macos-x64
            bundles: dmg
          - os: windows-latest
            name: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the installers
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - name: Collect them with their checksums
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*-setup.exe' \) \
            -exec cp {} dist/ \;
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum * > "../SHA256SUMS-${{ matrix.name }}.txt"; else shasum -a 256 * > "../SHA256SUMS-${{ matrix.name }}.txt"; fi
          mv "../SHA256SUMS-${{ matrix.name }}.txt" .
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
