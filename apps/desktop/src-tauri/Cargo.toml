[package]
name = "agent-os-nexo-desktop"
version = "0.1.0"
description = "agent-os-nexo desktop shell"
license-file = "../../../LICENSE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-notification = "2"

# Process groups and signals: stop the server and everything it started when the window closes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

# The registry (the environment as it is now, not as the launcher saw it) and a job object that ends the server
# with the app however the app ends. Both already come with Tauri on Windows.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# The GTK webview behind Tauri, to re-size it after a zoom change (see set_page_zoom in main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
gtk = "0.18"

[profile.release]
strip = true
lto = true
